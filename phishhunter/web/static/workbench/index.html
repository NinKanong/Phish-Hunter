x-shadow:var(--shadow);position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-35px;bottom:-40px;width:115px;height:115px;border-radius:50%;background:rgba(47,111,237,.07)}.kpi label{font-size:8px;color:#8ba0bb;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.kpi strong{display:block;font-size:25px;line-height:1;margin-top:10px;letter-spacing:-.04em}.kpi span{display:block;color:#5f738e;font-size:8px;margin-top:7px}.cyan{color:var(--cyan)}.blue-t{color:var(--blue)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.purple{color:var(--purple)}
.panel{border:1px solid var(--line);background:linear-gradient(180deg,#0d1b2e,#0a1526);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.panel h2{margin:0;font-size:14px;font-weight:950}.panel p{margin:5px 0 0;color:#6d819b;font-size:9px;line-height:1.6}.two{grid-template-columns:1.45fr .85fr;margin-top:12px}.three{grid-template-columns:1fr 1fr 1fr;margin-top:12px}.chartbox{margin-top:13px;border:1px solid var(--line2);background:#07111e;border-radius:12px;padding:9px}.chart{width:100%;height:260px;display:block}.gridline{stroke:#1a2a42;stroke-width:1}.tick{fill:#556b88;font-size:8px}.line1{fill:none;stroke:#67e8f9;stroke-width:3}.line2{fill:none;stroke:#8db3ff;stroke-width:2.4}.line3{fill:none;stroke:#70e6b4;stroke-width:2.1;stroke-dasharray:8 5}.line4{fill:none;stroke:#bdabff;stroke-width:2}.dot1{fill:#67e8f9}.dot2{fill:#8db3ff}.dot3{fill:#70e6b4}.dot4{fill:#bdabff}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.legend span{font-size:8px;color:#7287a0}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#67e8f9}.legend .blue{background:#8db3ff}.legend .green{background:#70e6b4}.legend .purple{background:#bdabff}.risk-layout{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin-top:15px}.donut{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:22px;border-radius:50%;background:#07111e;border:1px solid var(--line2)}.donut span{position:relative;z-index:1;text-align:center}.donut b{display:block;font-size:26px}.donut small{display:block;margin-top:3px;font-size:7px;color:#5f738f;text-transform:uppercase;letter-spacing:.14em}.risk-rows{display:grid;gap:11px}.risk-row{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px}.risk-row label{font-size:8px;color:#8396ad}.bar{height:8px;border-radius:99px;background:#07111e;border:1px solid #1b2d46;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2f6fed,#24d6e8)}.value{font-size:9px;text-align:right;font-weight:900}.metric-list{display:grid;gap:7px;margin-top:13px}.metric{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line2);background:#07111e;border-radius:10px;padding:10px}.metric span{font-size:8px;color:#647993}.metric b{font-size:10px}.table-wrap{overflow:auto;border:1px solid var(--line2);border-radius:11px;margin-top:13px}table{width:100%;min-width:1000px;border-collapse:collapse;font-size:9px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #152740;vertical-align:middle}th{color:#5e738f;background:#07111e;font-size:7px;letter-spacing:.14em;text-transform:uppercase;position:sticky;top:0}td{color:#bac8db}tbody tr:hover{background:#0b1a2c}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;border:1px solid #29405e;background:#102039;color:#a9bbd3;font-size:7px;font-weight:950;text-transform:uppercase;letter-spacing:.05em}.badge.good{border-color:#1b513a;background:#0b261c;color:#78ebb2}.badge.red{border-color:#612f3b;background:#2b151c;color:#ffa8b4}.badge.amber{border-color:#59470f;background:#251c07;color:#f8d26d}.badge.blue{border-color:#294e86;background:#0d203f;color:#94b8ff}.badge.purple{border-color:#55498a;background:#191530;color:#b6a9ff}.target{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link{border:0;background:none;padding:0;color:#6ce6f1;font-weight:900}.activity{display:grid;gap:7px;margin-top:12px}.event{display:grid;grid-template-columns:8px 1fr auto;gap:10px;border:1px solid var(--line2);background:#07111e;border-radius:10px;padding:10px}.event .dot{width:7px;height:7px;border-radius:50%;background:#64e5ae;margin-top:4px}.event.fail .dot{background:#ff8293}.event b{font-size:9px}.event small{display:block;font-size:8px;color:#5e728d;line-height:1.5;margin-top:4px}.event time{font-size:7px;color:#526780;white-space:nowrap}.heatmap{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:14px}.heatmap i{height:18px;border-radius:3px;background:#0b1a2b;border:1px solid #17283e}.heatmap i[data-v="1"]{background:#0d2b36}.heatmap i[data-v="2"]{background:#10414c}.heatmap i[data-v="3"]{background:#17616a}.heatmap i[data-v="4"]{background:#22a2aa}.heatmap i[data-v="5"]{background:#61e3e7}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.mini-card{border:1px solid var(--line2);background:#07111e;border-radius:10px;padding:10px}.mini-card small{display:block;color:#5f728c;font-size:7px;text-transform:uppercase;letter-spacing:.13em}.mini-card b{display:block;font-size:15px;margin-top:4px}.empty{border:1px dashed #263c59;border-radius:11px;padding:35px;text-align:center;color:#5d718d}.empty b{display:block;color:#9db0c8;margin-bottom:5px}.graph{position:relative;height:560px;overflow:hidden;border:1px solid var(--line2);border-radius:12px;background:radial-gradient(circle at center,#0c2946 0,#081523 42%,#060d18 100%)}.graph svg{position:absolute;inset:0;width:100%;height:100%}.graph-edge{stroke:#284c74;stroke-width:1.2;opacity:.65}.graph-edge.reported{stroke:#8d7aff}.graph-edge.extracted{stroke:#f5b43c}.graph-node{position:absolute;transform:translate(-50%,-50%);min-width:130px;max-width:185px;padding:10px 11px;border:1px solid #2d5c90;border-radius:11px;background:#0c1d31;color:#e8f1fd;cursor:pointer;box-shadow:0 14px 36px rgba(0,0,0,.3)}.graph-node:hover{border-color:#6be6ef;box-shadow:0 0 0 1px rgba(107,230,239,.12),0 18px 40px rgba(0,0,0,.4)}.graph-node strong{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.graph-node small{display:block;font-size:7px;color:#70849e;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.graph-node.user{border-color:#43c4d0;background:#102838}.graph-node.artifact{border-color:#4b7558}.graph-node.report{border-color:#6b5aaf}.graph-node.case{border-color:#82672d}.graph-node.ioc{border-color:#72414f}.profile-card{display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center}.profile-big{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#2f6fed,#24d6e8);display:grid;place-items:center;color:#041018;font-size:32px;font-weight:950}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:15px}.detail{border:1px solid var(--line2);background:#07111e;border-radius:10px;padding:10px}.detail small{display:block;color:#5f728c;font-size:7px;letter-spacing:.12em;text-transform:uppercase}.detail b{display:block;color:#e8f1fc;font-size:10px;margin-top:4px;word-break:break-word}.modal{position:fixed;inset:0;z-index:100;background:rgba(2,6,12,.85);backdrop-filter:blur(11px);padding:5vh 4vw;overflow:auto}.modal-card{max-width:1180px;margin:auto;border:1px solid #2b4768;background:#091423;border-radius:19px;box-shadow:0 45px 120px rgba(0,0,0,.6)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-body{padding:20px;display:grid;gap:12px}.close{border:1px solid #2a425e;background:#0b192b;color:#fff;border-radius:9px;padding:8px 11px}.pre{border:1px solid var(--line2);background:#050d17;border-radius:10px;padding:12px;max-height:360px;overflow:auto;color:#92a7bf;font:10px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.two,.three{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.top{padding:0 12px}}@media(max-width:680px){.content{padding:17px 12px 50px}.head{display:block}.privacy{margin-top:13px}.kpis{grid-template-columns:1fr 1fr}.risk-layout{grid-template-columns:1fr;justify-items:center}.detail-grid{grid-template-columns:1fr}.profile-card{grid-template-columns:1fr}.profile-big{width:64px;height:64px;font-size:25px}.graph{height:470px}.graph-node{min-width:104px;max-width:140px}}

  <div class="section">My workspace</div>

  </nav>

</aside>
<main class="main">
  <header class="top"><a href="/" class="back">← Home</a><div class="top-title" id="pageTitle">My Command Center</div><div class="top-right"><label style="display:flex;align-items:center;gap:6px;font-size:8px;color:#6f839d;font-weight:900;text-transform:uppercase;letter-spacing:.1em">History <select id="historyRange" style="border:1px solid #20324d;background:#07111e;color:#cfe0f3;border-radius:8px;padding:7px 9px;font-size:9px;outline:none"><option value="30">30d</option><option value="90">90d</option><option value="180">180d</option></select></label><span class="live">BACKEND CONNECTED</span><span class="role" id="rolePill">Analyst</span></div></header>

<script>
const content=document.getElementById('content');const pageTitle=document.getElementById('pageTitle');const nav=[...document.querySelectorAll('[data-tab]')];let DATA=null;let currentTab='overview';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=v=>v?new Date(v).toLocaleString():"—";
const shortTime=v=>v?new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):"—";
const maxOf=(a)=>Math.max(1,...a);
const pct=(n,total)=>Math.round((n/Math.max(1,total))*100);
function setNav(tab){currentTab=tab;nav.forEach(b=>{if(b.tagName==='BUTTON')b.classList.toggle('active',b.dataset.tab===tab)});}
async function api(path){const r=await fetch('/api/v1'+path,{credentials:'include'});if(!r.ok)throw new Error((await r.text())||'Request failed');return r.json()}
function lineSvg(series,keys,labels=true){const W=980,H=280,L=42,R=16,T=18,B=34;const vals=series.flatMap(d=>keys.map(k=>Number(d[k]||0)));const M=maxOf(vals);const x=i=>L+i*(W-L-R)/Math.max(series.length-1,1);const y=v=>H-B-(v/M)*(H-B-T);const classes=['line1','line2','line3','line4'];let s='';for(let i=0;i<=4;i++){const yy=T+i*(H-B-T)/4;s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" class="gridline"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="tick">${Math.round(M*(4-i)/4)}</text>`}keys.forEach((k,j)=>{const path=series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(Number(d[k]||0)).toFixed(1)}`).join(' ');s+=`<path d="${path}" class="${classes[j]||'line1'}"/>`;series.forEach((d,i)=>{s+=`<circle cx="${x(i)}" cy="${y(Number(d[k]||0))}" r="${j?3:3.4}" class="dot${j+1}"/>`})});if(labels){series.forEach((d,i)=>{if(i%5===0||i===series.length-1)s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" class="tick">${esc(d.label)}</text>`})}return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`}
function riskDonut(){const r=DATA.risk;const vals=[r.critical,r.high,r.medium,r.low];const total=Math.max(1,vals.reduce((a,b)=>a+b,0));let cur=0;const colors=['#ff8395','#ef5b70','#f4bf5e','#65e5af'];const seg=[];for(let i=0;i<vals.length;i++){const a=cur/total*100,b=(cur+vals[i])/total*100;seg.push(`${colors[i]} ${a}% ${b}%`);cur+=vals[i]}return `<div class="donut" style="background:conic-gradient(${seg.join(',')})"><span><b>${total}</b><small>risk-scored scans</small></span></div>`}
function badgeForRisk(score){score=Number(score||0);return score>=85?'red':score>=60?'amber':'good'}
function heat(){const p=DATA.trend;return `<div class="heatmap">${p.map(x=>`<i title="${esc(x.label)} · ${x.events} events · ${x.scans} scans" data-v="${Math.min(5,Math.max(0,x.events+x.scans))}"></i>`).join('')}</div>`}
function overview(){const s=DATA.stats;const scans=DATA.recent_scans.slice(0,10);return `<div class="head"><div><div class="eyebrow">PHISH-HUNTER-K4 · PRIVATE ANALYST CONSOLE</div><div class="title">Your investigation command center</div><div class="sub">A deep personal view of the work created by <b>@${esc(DATA.user.username||DATA.user.email.split('@')[0])}</b>. Scan frequency, evidence, reports, cases, indicators and identity history are all filtered to your authenticated account.</div><div class="actions"><a class="btn cyan" href="/analyze/phishing">Analyze email</a><a class="btn" href="/analyze/url">Analyze URL</a><a class="btn" href="/analyze/malware">Analyze file</a><a class="btn blue" href="/services/pcap-analyst">Open PCAP</a></div></div><div class="privacy"><b>PRIVATE SCOPE · USER #${DATA.user.id}</b><br>${esc(DATA.privacy.message)}<br><span style="color:#5f768f">Administrator accounts can review platform-wide data from Admin Control; Analyst accounts cannot.</span></div></div>
<div class="grid kpis"><div class="kpi"><label>Investigations</label><strong class="cyan">${s.scans}</strong><span>${s.scans_window} in last ${DATA.history.days}d</span></div><div class="kpi"><label>High risk</label><strong class="red">${s.high_risk}</strong><span>${s.critical} critical</span></div><div class="kpi"><label>Evidence</label><strong class="blue-t">${s.artifacts}</strong><span>owned file records</span></div><div class="kpi"><label>Reports</label><strong class="green">${s.reports}</strong><span>private reports</span></div><div class="kpi"><label>Cases</label><strong class="purple">${s.cases}</strong><span>${s.open_cases} open</span></div><div class="kpi"><label>Indicators</label><strong class="amber">${s.iocs}</strong><span>private IOCs</span></div><div class="kpi"><label>Active days</label><strong class="cyan">${s.active_days_window}</strong><span>out of ${DATA.history.days} days</span></div><div class="kpi"><label>Avg risk</label><strong class="red">${s.avg_risk}</strong><span>full scan corpus</span></div></div>
<div class="grid two"><section class="panel"><div class="panel-head"><div><h2>${DATA.history.days}-day activity frequency</h2><p>Scans, sign-ins, identity events and owned evidence/report creation over time.</p></div><button class="btn" onclick="loadTab('activity')">Open full history →</button></div><div class="chartbox">${lineSvg(DATA.trend,['scans','logins','events','artifacts'])}</div><div class="legend"><span><i></i>Scans</span><span><i class="blue"></i>Logins</span><span><i class="green"></i>Events</span><span><i class="purple"></i>Evidence</span></div></section><section class="panel"><div class="panel-head"><div><h2>Activity heatmap</h2><p>Quick frequency view of your personal workspace.</p></div><span class="badge blue">${DATA.history.days} DAYS</span></div>${heat()}<div class="mini-grid"><div class="mini-card"><small>Login days</small><b>${s.login_days_window}</b></div><div class="mini-card"><small>Events · ${DATA.history.days}d</small><b>${s.events_window}</b></div><div class="mini-card"><small>Highest risk</small><b>${s.highest_risk}</b></div><div class="mini-card"><small>Latest scan</small><b>${scans[0]?fmt(scans[0].created_at):'—'}</b></div></div></section></div>
<div class="grid three"><section class="panel"><div class="panel-head"><div><h2>Risk distribution</h2><p>Full private scan corpus.</p></div></div><div class="risk-layout">${riskDonut()}<div class="risk-rows">${[['Critical',DATA.risk.critical,'red'],['High',DATA.risk.high,'red'],['Medium',DATA.risk.medium,'amber'],['Low',DATA.risk.low,'green']].map(x=>`<div class="risk-row"><label>${x[0]}</label><div class="bar"><i style="width:${pct(x[1],Math.max(s.scans,1))}%"></i></div><div class="value">${x[1]}</div></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Investigation mix</h2><p>Which analyzers you use most.</p></div></div><div class="metric-list">${(DATA.scan_types.length?DATA.scan_types:[{type:'No scans',count:0}]).slice(0,6).map(x=>`<div class="metric"><span>${esc(x.type)}</span><b>${x.count}</b></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Identity posture</h2><p>Current authenticated account.</p></div><button class="btn" onclick="loadTab('profile')">My identity</button></div><div class="metric-list"><div class="metric"><span>Username</span><b>@${esc(DATA.user.username||DATA.user.email.split('@')[0])}</b></div><div class="metric"><span>Role</span><b>${DATA.user.is_admin?'Administrator':'Analyst'}</b></div><div class="metric"><span>Last login</span><b>${fmt(DATA.user.last_login_at)}</b></div><div class="metric"><span>Account created</span><b>${fmt(DATA.user.created_at)}</b></div></div></section></div>
<div class="grid two"><section class="panel"><div class="panel-head"><div><h2>Recent investigations</h2><p>Files, URLs, email and PCAP work stored under your owner ID.</p></div><button class="btn" onclick="loadTab('scans')">View all →</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Analyzer</th><th>Target / filename</th><th>Verdict</th><th>Risk</th><th>IOCs</th><th>Created</th></tr></thead><tbody>${scans.map(x=>`<tr><td>#${x.id}</td><td><span class="badge blue">${esc(x.type)}</span></td><td><button class="link target" onclick="openScan(${x.id})">${esc(x.target)}</button></td><td>${esc(x.verdict)}</td><td><span class="badge ${badgeForRisk(x.risk_score)}">${x.risk_score}</span></td><td>${x.ioc_count}</td><td>${fmt(x.created_at)}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><b>No investigations yet</b>Your first authenticated analysis will appear here.</div></td></tr>`}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Latest activity</h2><p>Account and analysis history from the persistent identity ledger.</p></div><button class="btn" onclick="loadTab('activity')">Open history</button></div>${activityList(8)}</section></div>`}
function activityList(limit=40){return `<div class="activity">${DATA.activity.slice(0,limit).map(a=>`<div class="event ${a.success?'':'fail'}"><span class="dot"></span><div><b>${esc(a.action)}</b><small>${esc(a.detail||a.event_type)}</small></div><time>${fmt(a.created_at)}</time></div>`).join('')||'<div class="empty"><b>No activity yet</b>Events will appear after you use the account.</div>'}</div>`}
function activityTab(){return `<div class="head"><div><div class="eyebrow">ACCOUNT TELEMETRY</div><div class="title">Activity & frequency</div><div class="sub">A full private timeline of sign-ins, account changes and analysis events for your own identity.</div></div><span class="badge good">PRIVATE EVENT LEDGER</span></div><div class="grid two" style="margin-top:14px"><section class="panel"><div class="panel-head"><div><h2>Frequency graph</h2><p>Daily successful logins, scans, all events and evidence creation.</p></div></div><div class="chartbox">${lineSvg(DATA.trend,['events','scans','logins','artifacts'])}</div><div class="legend"><span><i></i>Events</span><span><i class="blue"></i>Scans</span><span><i class="green"></i>Logins</span><span><i class="purple"></i>Evidence</span></div></section><section class="panel"><div class="panel-head"><div><h2>Usage summary</h2><p>Selected-range behavioral counts, not browser-local guesses.</p></div></div><div class="mini-grid"><div class="mini-card"><small>Active days</small><b>${DATA.stats.active_days_window}</b></div><div class="mini-card"><small>Login days</small><b>${DATA.stats.login_days_window}</b></div><div class="mini-card"><small>Events · ${DATA.history.days}d</small><b>${DATA.stats.events_window}</b></div><div class="mini-card"><small>Scans · ${DATA.history.days}d</small><b>${DATA.stats.scans_window}</b></div></div><div style="margin-top:13px">${activityList(12)}</div></section></div>`}
function scansTab(){return `<div class="head"><div><div class="eyebrow">PRIVATE INVESTIGATIONS</div><div class="title">My investigations</div><div class="sub">Every row below is owned by your authenticated user. Open a record to inspect the stored result, indicators, reports and linked cases.</div></div><button class="btn cyan" onclick="location.href='/analyze/phishing'">New analysis</button></div><section class="panel" style="margin-top:14px"><div class="panel-head"><div><h2>Investigation registry</h2><p>${DATA.stats.scans} total private scans.</p></div><input class="search" id="scanSearch" placeholder="Search target, type, verdict…" style="max-width:320px;border:1px solid #29405f;background:#07111e;color:#fff;border-radius:9px;padding:9px 10px;outline:none"></div><div class="table-wrap"><table id="scanTable"><thead><tr><th>ID</th><th>Type</th><th>Target / filename</th><th>Status</th><th>Verdict</th><th>Risk</th><th>IOCs</th><th>Created</th></tr></thead><tbody>${DATA.recent_scans.map(x=>`<tr data-search="${esc((x.type+' '+x.target+' '+x.verdict).toLowerCase())}"><td>#${x.id}</td><td><span class="badge blue">${esc(x.type)}</span></td><td><button class="link target" onclick="openScan(${x.id})">${esc(x.target)}</button></td><td><span class="badge ${x.status==='completed'?'good':'blue'}">${esc(x.status)}</span></td><td>${esc(x.verdict)}</td><td><span class="badge ${badgeForRisk(x.risk_score)}">${x.risk_score}</span></td><td>${x.ioc_count}</td><td>${fmt(x.created_at)}</td></tr>`).join('')||`<tr><td colspan="8"><div class="empty"><b>No private scans</b>Run an analysis to populate your investigation history.</div></td></tr>`}</tbody></table></div></section>`}
function evidenceTab(){return `<div class="head"><div><div class="eyebrow">PRIVATE EVIDENCE</div><div class="title">Evidence & files</div><div class="sub">Uploaded artifacts are visible only through your authenticated owner scope. Hashes and filenames remain attached to your personal investigation history.</div></div><button class="btn blue" onclick="loadTab('scans')">Review investigations</button></div><div class="grid three" style="margin-top:14px">${DATA.recent_artifacts.map(a=>`<section class="panel"><div class="panel-head"><span class="badge blue">${esc(a.type)}</span><span class="badge">${a.size_bytes} B</span></div><h2 style="margin-top:12px;word-break:break-word">${esc(a.filename)}</h2><p>Job <span style="color:#91a6bf">${esc(a.job_id)}</span></p><div class="pre" style="margin-top:12px;max-height:120px">SHA-256\n${esc(a.sha256)}</div><div style="margin-top:10px;color:#5e728d;font-size:8px">Created ${fmt(a.created_at)}</div></section>`).join('')||`<div class="empty" style="grid-column:1/-1"><b>No evidence in your account</b>Uploaded analysis files will appear here after a job is created.</div>`}</div>`}
function reportsTab(){return `<div class="head"><div><div class="eyebrow">PRIVATE REPORTS</div><div class="title">Report registry</div><div class="sub">Reports generated from your scans. Another normal account cannot retrieve these rows through the owner-scoped API.</div></div><span class="badge green">${DATA.stats.reports} TOTAL</span></div><section class="panel" style="margin-top:14px"><div class="table-wrap" style="margin-top:0"><table><thead><tr><th>ID</th><th>Title</th><th>Format</th><th>Source scan</th><th>Created</th></tr></thead><tbody>${DATA.recent_reports.map(r=>`<tr><td>#${r.id}</td><td>${esc(r.title)}</td><td><span class="badge blue">${esc(r.format)}</span></td><td><button class="link" onclick="openScan(${r.scan_id})">Scan #${r.scan_id}</button></td><td>${fmt(r.created_at)}</td></tr>`).join('')||`<tr><td colspan="5"><div class="empty"><b>No reports yet</b>Generated reports will be stored in your private account registry.</div></td></tr>`}</tbody></table></div></section>`}
function casesTab(){return `<div class="head"><div><div class="eyebrow">PRIVATE CASES</div><div class="title">My cases</div><div class="sub">Cases opened by this identity. Case reads and writes are owner-scoped for normal accounts.</div></div><span class="badge purple">${DATA.stats.open_cases} OPEN</span></div><div class="grid three" style="margin-top:14px">${DATA.recent_cases.map(c=>`<section class="panel"><div class="panel-head"><span class="badge ${c.priority==='critical'?'red':'purple'}">${esc(c.priority)}</span><span class="badge ${c.status==='open'?'good':'blue'}">${esc(c.status)}</span></div><h2 style="margin-top:12px">CASE-${String(c.id).padStart(5,'0')}</h2><p>${esc(c.title)}</p><div style="font-size:8px;color:#5f728d">Created ${fmt(c.created_at)}</div></section>`).join('')||`<div class="empty" style="grid-column:1/-1"><b>No private cases</b>Create a case from an investigation workflow to track it here.</div>`}</div>`}
function iocsTab(){const rows=DATA.graph.nodes.filter(n=>n.type==='ioc').map(n=>n.detail);return `<div class="head"><div><div class="eyebrow">PRIVATE INTELLIGENCE</div><div class="title">Indicator registry</div><div class="sub">IOC values extracted from your analyses only.</div></div><input class="search" id="iocSearch" placeholder="Search IP, domain, hash, email…" style="max-width:340px;border:1px solid #29405f;background:#07111e;color:#fff;border-radius:9px;padding:9px 10px;outline:none"></div><section class="panel" style="margin-top:14px"><div class="table-wrap" style="margin-top:0"><table id="iocTable"><thead><tr><th>Kind</th><th>Indicator</th><th>Source scan</th><th>Created</th></tr></thead><tbody>${rows.map(x=>`<tr data-search="${esc((x.kind+' '+x.value).toLowerCase())}"><td><span class="badge blue">${esc(x.kind)}</span></td><td style="word-break:break-all">${esc(x.value)}</td><td><button class="link" onclick="openScan(${x.source_scan_id})">#${x.source_scan_id}</button></td><td>${fmt(x.created_at)}</td></tr>`).join('')||`<tr><td colspan="4"><div class="empty"><b>No indicators</b>Indicators appear after analysis produces them.</div></td></tr>`}</tbody></table></div></section>`}
function graphTab(){const nodes=DATA.graph.nodes,edges=DATA.graph.edges;const positions={};const root=nodes.find(n=>n.type==='user');if(root)positions[root.id]=[50,50];const groups=['scan','artifact','report','case','ioc'];groups.forEach((type,j)=>{const list=nodes.filter(n=>n.type===type);list.forEach((n,i)=>{const centerX=[50,23,77,30,70][j];const y=12+(i%7)*12;const x=centerX + (((i%2)*2-1)*(j%3===0?7:5));positions[n.id]=[Math.max(7,Math.min(93,x)),Math.max(9,Math.min(91,y))]})});return `<div class="head"><div><div class="eyebrow">RELATIONSHIP INTELLIGENCE</div><div class="title">Identity graph</div><div class="sub">A visual relationship map centered on your account: identity → investigations → reports → evidence → cases → indicators. Click a node for detail.</div></div><span class="badge blue">${nodes.length} NODES · ${edges.length} EDGES</span></div><section class="panel" style="margin-top:14px"><div class="graph" id="graphCanvas"><svg viewBox="0 0 1000 560" preserveAspectRatio="none">${edges.map(e=>{const a=positions[e.source]||[50,50],b=positions[e.target]||[50,50];return `<line x1="${a[0]*10}" y1="${a[1]*5.6}" x2="${b[0]*10}" y2="${b[1]*5.6}" class="graph-edge ${esc(e.kind)}"/>`}).join('')}</svg>${nodes.map((n,i)=>{const p=positions[n.id]||[50,50];return `<button class="graph-node ${esc(n.type)}" data-node-index="${i}" style="left:${p[0]}%;top:${p[1]}%"><strong>${esc(n.label)}</strong><small>${esc(n.subtitle)}</small></button>`}).join('')}</div></section>`}
function profileTab(){const u=DATA.user,s=DATA.stats;return `<div class="head"><div><div class="eyebrow">PRIVATE IDENTITY</div><div class="title">My identity & history</div><div class="sub">Your persistent identity record and the usage footprint attached to it. Account information stays scoped to this authenticated user in the personal workspace.</div></div><a class="btn" href="/account">Account settings →</a></div><div class="grid two" style="margin-top:14px"><section class="panel"><div class="profile-card"><div class="profile-big">${esc((u.display_name||u.username||'K').slice(0,1).toUpperCase())}</div><div><div class="eyebrow">@${esc(u.username||u.email.split('@')[0])}</div><h2 style="font-size:22px;margin-top:6px">${esc(u.display_name)}</h2><p>${esc(u.email)} · ${esc(u.job_title)}</p><span class="badge ${u.is_admin?'purple':'blue'}">${u.is_admin?'Administrator':'Analyst'}</span> <span class="badge ${u.disabled?'red':'good'}">${u.disabled?'Disabled':'Active'}</span></div></div><div class="detail-grid"><div class="detail"><small>User ID</small><b>#${u.id}</b></div><div class="detail"><small>Username</small><b>@${esc(u.username||'—')}</b></div><div class="detail"><small>Created</small><b>${fmt(u.created_at)}</b></div><div class="detail"><small>Last login</small><b>${fmt(u.last_login_at)}</b></div><div class="detail"><small>Timezone</small><b>${esc(u.timezone)}</b></div><div class="detail"><small>Scope</small><b>Private</b></div><div class="detail"><small>Role</small><b>${u.is_admin?'Administrator':'Analyst'}</b></div><div class="detail"><small>${DATA.history.days}d active days</small><b>${s.active_days_window}</b></div></div></section><section class="panel"><div class="panel-head"><div><h2>Personal footprint</h2><p>Objects attached to your account.</p></div></div><div class="mini-grid"><div class="mini-card"><small>Investigations</small><b>${s.scans}</b></div><div class="mini-card"><small>Reports</small><b>${s.reports}</b></div><div class="mini-card"><small>Evidence</small><b>${s.artifacts}</b></div><div class="mini-card"><small>Cases</small><b>${s.cases}</b></div><div class="mini-card"><small>IOCs</small><b>${s.iocs}</b></div><div class="mini-card"><small>Activity events</small><b>${s.events}</b></div></div><div style="margin-top:14px">${activityList(10)}</div></section></div>`}
function openScan(id){api('/me/scans/'+id).then(data=>{const root=document.createElement('div');root.className='modal';root.innerHTML=`<div class="modal-card"><div class="modal-head"><div><div class="eyebrow">PRIVATE INVESTIGATION #${data.scan.id}</div><h2 style="font-size:24px;margin-top:6px">${esc(data.scan.target)}</h2><p>${esc(data.scan.type)} · ${esc(data.scan.verdict)} · risk ${data.scan.risk_score} · ${fmt(data.scan.created_at)}</p></div><button class="close" id="close">Close</button></div><div class="modal-body"><div class="grid three"><div class="mini-card"><small>IOCs</small><b>${data.iocs.length}</b></div><div class="mini-card"><small>Reports</small><b>${data.reports.length}</b></div><div class="mini-card"><small>Cases</small><b>${data.cases.length}</b></div></div><div class="grid two"><section class="panel"><h2>Analysis result</h2><p>${esc(data.scan.result?.summary||data.scan.result?.description||'No summary field returned by the analyzer.')}</p><div class="metric-list"><div class="metric"><span>Verdict</span><b>${esc(data.scan.verdict)}</b></div><div class="metric"><span>Status</span><b>${esc(data.scan.status)}</b></div><div class="metric"><span>Risk score</span><b>${data.scan.risk_score}</b></div></div></section><section class="panel"><h2>Linked intelligence</h2><div class="metric-list">${data.iocs.slice(0,14).map(x=>`<div class="metric"><span class="badge blue">${esc(x.kind)}</span><b style="max-width:330px;word-break:break-all">${esc(x.value)}</b></div>`).join('')||'<div class="empty">No indicators stored for this scan.</div>'}</div></section></div><section class="panel"><h2>Evidence & files</h2><div class="grid three" style="margin-top:12px">${data.artifacts.map(a=>`<div class="detail"><small>${esc(a.type)}</small><b>${esc(a.filename)}</b><span style="display:block;margin-top:4px;color:#59708c;font-size:8px">${a.size_bytes} bytes · ${esc(a.sha256)}</span></div>`).join('')||'<div class="empty" style="grid-column:1/-1">No linked artifact record for this scan.</div>'}</div></section><section class="panel"><h2>Structured analyzer output</h2><div class="pre">${esc(JSON.stringify(data.scan.result,null,2))}</div></section></div></div>`;root.querySelector('#close').onclick=()=>root.remove();root.addEventListener('click',e=>{if(e.target===root)root.remove()});document.body.appendChild(root)}).catch(e=>alert(e.message||e))}
function nodeDetail(detail){const d=detail||{};const root=document.createElement('div');root.className='modal';root.innerHTML=`<div class="modal-card" style="max-width:800px"><div class="modal-head"><div><div class="eyebrow">GRAPH ENTITY</div><h2 style="font-size:22px;margin-top:6px">${esc(d.filename||d.title||d.value||d.target||('@'+(d.username||'identity')))}</h2></div><button class="close" id="close-node">Close</button></div><div class="modal-body"><div class="detail-grid">${Object.entries(d).map(([k,v])=>`<div class="detail"><small>${esc(k)}</small><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}</div></div></div>`;root.querySelector('#close-node').onclick=()=>root.remove();document.body.appendChild(root)}
function bindSearch(id,tableId){const input=document.getElementById(id),table=document.getElementById(tableId);if(!input||!table)return;input.addEventListener('input',()=>{const q=input.value.toLowerCase();table.querySelectorAll('tbody tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')})}
async function render(tab){setNav(tab);const titles={overview:'My Command Center',activity:'Activity & frequency',scans:'My investigations',graph:'Identity graph',evidence:'Evidence & files',reports:'Report registry',cases:'My cases',iocs:'Indicator registry',profile:'My identity'};pageTitle.textContent=titles[tab]||'My Workbench';const f={overview,activity:activityTab,scans:scansTab,graph:graphTab,evidence:evidenceTab,reports:reportsTab,cases:casesTab,iocs:iocsTab,profile:profileTab};content.innerHTML=(f[tab]||overview)();if(tab==='scans')bindSearch('scanSearch','scanTable');if(tab==='iocs')bindSearch('iocSearch','iocTable');if(tab==='graph')document.querySelectorAll('[data-node-index]').forEach(btn=>btn.addEventListener('click',()=>nodeDetail(DATA.graph.nodes[Number(btn.dataset.nodeIndex)]?.detail||{})))}
nav.forEach(b=>{if(b.tagName==='BUTTON'&&b.dataset.tab)b.addEventListener('click',()=>{location.hash=b.dataset.tab;render(b.dataset.tab)})});
async function loadOverviewDays(days,tab){DATA=await api('/me/overview?days='+encodeURIComponent(days));document.getElementById('historyRange').value=String(days);await render(tab)}
const historyRange=document.getElementById('historyRange');if(historyRange)historyRange.addEventListener('change',()=>loadOverviewDays(historyRange.value,location.hash.slice(1)||'overview').catch(e=>{content.innerHTML=`<div class="empty"><b>Unable to reload private analytics</b>${esc(e.message)}</div>`}));
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1)||'overview';render(t)});
async function boot(){try{const initialDays=30;DATA=await api('/me/overview?days='+initialDays);document.getElementById('sideName').textContent=(DATA.user.display_name||'Analyst')+' · @'+(DATA.user.username||DATA.user.email.split('@')[0]);document.getElementById('sideEmail').textContent=DATA.user.email;document.getElementById('sideAvatar').textContent=(DATA.user.display_name||'K').slice(0,1).toUpperCase();document.getElementById('rolePill').textContent=DATA.user.is_admin?'Administrator':'Analyst';if(historyRange)historyRange.value=String(DATA.history?.days||30);await render(location.hash.slice(1)||'overview')}catch(e){content.innerHTML=`<div class="empty"><b>Private workbench unavailable</b>${esc(e.message)}</div>`}}
window.openScan=openScan;window.nodeDetail=nodeDetail;window.loadTab=render;boot();
</script>
</body>
</html>
