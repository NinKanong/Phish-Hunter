{% extends "base.html" %}{% block content %}<section class="mx-auto max-w-4xl px-5 py-12"><div class="text-sm font-bold text-red-400">PCAP FORENSICS</div><h1 class="mt-2 text-4xl font-black">Analyze a packet capture</h1><p class="mt-4 text-slate-400">Classic PCAP metadata and flow analysis. Payloads are parsed as bytes only and never executed.</p><form method="post" enctype="multipart/form-data" class="mt-8 rounded-3xl border border-slate-800 bg-slate-900/60 p-7"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label class="block text-sm font-bold">Capture file<input class="mt-2 block w-full rounded-xl border border-slate-700 bg-slate-950 p-4" type="file" name="file" accept=".pcap,.cap" required></label><button class="mt-5 rounded-xl bg-red-500 px-5 py-3 font-bold">Run PCAP analysis</button></form></section>{% endblock %}
