{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-3xl px-5 py-20">
  <div class="rounded-3xl border border-red-500/20 bg-red-500/5 p-8">
    <div class="text-xs font-black uppercase tracking-[.25em] text-red-300">{{ service.eyebrow }}</div>
    <h1 class="mt-3 text-3xl font-black">{{ title }}</h1>
    <p class="mt-4 text-slate-300">{{ error }}</p>
    <a href="/services" class="mt-6 inline-block rounded-lg bg-cyan-400 px-4 py-2 font-bold text-slate-950">Back to workspace</a>
  </div>
</section>
{% endblock %}
