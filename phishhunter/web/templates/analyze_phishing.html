{% extends "base.html" %}{% block content %}<h1 class="text-4xl font-bold">Phishing Analyzer</h1><p class="text-zinc-500 mt-2">Upload an EML message. Attachments are inspected as metadata only; they are never executed.</p><form method="post" enctype="multipart/form-data" class="mt-8 border border-dashed border-zinc-700 p-10 rounded-xl"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="file" name="file" accept=".eml,message/rfc822" required class="w-full"><button class="mt-6 bg-red-500 px-6 py-3 rounded font-bold">Analyze email</button></form>{% endblock %}
