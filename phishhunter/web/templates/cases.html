{% extends "base.html" %}{% block content %}<div class="flex justify-between"><h1 class="text-4xl font-bold">Cases</h1></div><form method="post" class="grid md:grid-cols-4 gap-3 mt-6"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input name="title" required placeholder="Case title" class="bg-zinc-900 border border-zinc-700 p-3 rounded"><select name="priority" class="bg-zinc-900 border border-zinc-700 p-3 rounded"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select><input name="notes" placeholder="Notes" class="bg-zinc-900 border border-zinc-700 p-3 rounded"><button class="bg-red-500 rounded">Create case</button></form><div class="mt-8 space-y-3">{% for c in cases %}<div class="border border-zinc-800 rounded p-4"><b>#{{c.id}} {{c.title}}</b><span class="ml-3 text-zinc-500">{{c.priority}} · {{c.status}}</span><p class="text-zinc-500 mt-2">{{c.notes}}</p></div>{% endfor %}</div>{% endblock %}
