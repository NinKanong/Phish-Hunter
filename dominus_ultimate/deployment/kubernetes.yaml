apiVersion: apps/v1
kind: Deployment
metadata: {name: dominus-api}
spec:
  replicas: 3
  selector: {matchLabels: {app: dominus-api}}
  template:
    metadata: {labels: {app: dominus-api}}
    spec:
      containers:
      - name: api
        image: phishhunter/dominus-api:v23
        ports: [{containerPort: 8000}]
        envFrom: [{secretRef: {name: dominus-secrets}}]
        readinessProbe: {httpGet: {path: /health, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: dominus-api}
spec:
  selector: {app: dominus-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dominus-worker}
spec:
  replicas: 4
  selector: {matchLabels: {app: dominus-worker}}
  template:
    metadata: {labels: {app: dominus-worker}}
    spec:
      containers:
      - name: worker
        image: phishhunter/dominus-worker:v23
        envFrom: [{secretRef: {name: dominus-secrets}}]
